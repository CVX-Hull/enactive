[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.importlinter]
root_package = "harness"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Computer authority remains independent of player semantics and adapters"
type = "forbidden"
source_modules = ["harness.computer"]
forbidden_modules = ["harness.player", "harness.application", "harness.server", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "Player logic uses data and control ports without acquiring executor custody"
type = "forbidden"
source_modules = ["harness.player"]
forbidden_modules = ["harness.computer.runtime", "harness.computer.channel", "harness.computer.store", "harness.computer.launch", "harness.application", "harness.server", "harness.__main__", "http", "urllib", "socket", "subprocess", "tools"]

[[tool.importlinter.contracts]]
name = "Player adapters cannot instantiate the computer or server"
type = "forbidden"
source_modules = ["harness.player_client", "harness.player_tools", "harness.player_mcp"]
forbidden_modules = ["harness.computer.runtime", "harness.computer.channel", "harness.computer.store", "harness.computer.launch", "harness.application", "harness.server", "harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "Evaluation never reaches the player, its adapters or the computer (ADR008)"
type = "forbidden"
source_modules = ["harness.player", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.computer", "harness.application", "harness.server"]
forbidden_modules = ["harness.evaluation"]

[[tool.importlinter.contracts]]
name = "Evaluation core is game-neutral and imports no binding"
type = "forbidden"
source_modules = ["harness.evaluation.core"]
forbidden_modules = ["harness.evaluation.cdda"]

[[tool.importlinter.contracts]]
name = "Evaluation reads records only and holds no custody or network access"
type = "forbidden"
source_modules = ["harness.evaluation"]
forbidden_modules = ["harness.computer.runtime", "harness.computer.channel", "harness.computer.launch", "harness.application", "harness.server", "harness.player_mcp", "harness.player_client", "tools", "http", "urllib", "socket", "subprocess"]

[[tool.importlinter.contracts]]
name = "The viewer reads evaluation records only and holds no custody or player access (ADR008)"
type = "forbidden"
source_modules = ["harness.viewer"]
forbidden_modules = ["harness.computer.runtime", "harness.computer.channel", "harness.computer.launch", "harness.application", "harness.server", "harness.player", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.__main__", "tools", "subprocess"]

[[tool.importlinter.contracts]]
name = "Trace projection reads sealed evidence only and holds no custody, player or evaluation access"
type = "forbidden"
source_modules = ["harness.trace"]
forbidden_modules = ["harness.computer", "harness.application", "harness.server", "harness.player", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.evaluation", "harness.viewer", "harness.curator", "harness.__main__", "tools", "http", "urllib", "socket", "subprocess"]

[[tool.importlinter.contracts]]
name = "The curator holds no custody, player access or evaluation records (ADR 009, ADR008)"
type = "forbidden"
source_modules = ["harness.curator"]
forbidden_modules = ["harness.computer", "harness.application", "harness.server", "harness.player", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.evaluation", "harness.viewer", "harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "Nothing in the player, its adapters, the computer or evaluation reaches the curator"
type = "forbidden"
source_modules = ["harness.player", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.computer", "harness.application", "harness.server", "harness.evaluation", "harness.viewer"]
forbidden_modules = ["harness.curator"]

[[tool.importlinter.contracts]]
name = "HTTP server does not depend on CLI or build tooling"
type = "forbidden"
source_modules = ["harness.server"]
forbidden_modules = ["harness.__main__", "tools"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "assurance_governance: advisory C-GOVERNANCE registry structure in isolated fixtures; no prose-truth or reviewer-performance proof; docs/testing.md#engineering-assurance",
]
