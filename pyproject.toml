[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.importlinter]
root_package = "harness"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Computer authority remains independent of player semantics and adapters"
type = "forbidden"
source_modules = ["harness.computer"]
forbidden_modules = ["harness.player", "harness.application", "harness.server", "harness.player_client", "harness.player_tools", "harness.player_mcp", "harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "Player logic uses data and control ports without acquiring executor custody"
type = "forbidden"
source_modules = ["harness.player"]
forbidden_modules = ["harness.computer.runtime", "harness.computer.channel", "harness.computer.store", "harness.computer.launch", "harness.application", "harness.server", "harness.__main__", "http", "urllib", "socket", "subprocess", "tools"]

[[tool.importlinter.contracts]]
name = "Player adapters cannot instantiate the computer or server"
type = "forbidden"
source_modules = ["harness.player_client", "harness.player_tools", "harness.player_mcp"]
forbidden_modules = ["harness.computer.runtime", "harness.computer.channel", "harness.computer.store", "harness.computer.launch", "harness.application", "harness.server", "harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "HTTP server does not depend on CLI or build tooling"
type = "forbidden"
source_modules = ["harness.server"]
forbidden_modules = ["harness.__main__", "tools"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "assurance_context: advisory C-RUNTIME context projection and copy isolation; docs/components/player-interface.md#context-and-failure-boundaries",
    "assurance_memory: advisory C-RUNTIME durable memory provenance and source loss; docs/components/memory-learning.md#failure-bounds-and-ownership",
    "assurance_freshness: advisory C-RUNTIME original capture and current input authority; docs/components/native-control.md#internal-responsibilities",
    "assurance_ingress: advisory C-RUNTIME operation identity and uncertain delivery in HTTP fixtures; docs/components/player-interface.md#assurance-and-evidence",
    "assurance_execution: advisory C-RUNTIME accounting and authority recovery in SQLite fixtures; docs/components/mission-execution.md#assurance-and-evidence",
    "assurance_native: advisory C-RUNTIME compiled receiver fixture for production dispatch boundaries; no actual-game qualification; docs/components/native-control.md#assurance-and-evidence",
    "assurance_program: advisory C-RUNTIME bounded program execution and ordinary fallback in JS/writer fixtures; docs/components/memory-learning.md#assurance-and-evidence",
    "assurance_advice: advisory C-RUNTIME advice and procedure provenance without authority in SQLite/archive fixtures; docs/components/memory-learning.md#assurance-and-evidence",
    "assurance_observer: advisory C-RUNTIME passive status projection in host/HTTP fixtures; no browser-layout or cadence proof; docs/components/observer-operations.md#assurance-and-evidence",
    "assurance_governance: advisory C-GOVERNANCE registry structure in isolated fixtures; no prose-truth or reviewer-performance proof; docs/testing.md#engineering-assurance",
]
