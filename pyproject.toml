[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.importlinter]
root_package = "harness"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Controller remains independent of adapters and tooling"
type = "forbidden"
source_modules = ["harness.controller"]
forbidden_modules = [
    "harness.server", "harness.__main__", "http", "urllib", "socket",
    "tools", "subprocess", "argparse",
]

[[tool.importlinter.contracts]]
name = "Server does not depend on CLI or build tooling"
type = "forbidden"
source_modules = ["harness.server"]
forbidden_modules = ["harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "Gameplay records and evidence cannot dispatch or launch tools"
type = "forbidden"
source_modules = ["harness.gameplay"]
forbidden_modules = [
    "harness.controller", "harness.server", "harness.__main__",
    "http", "urllib", "socket", "subprocess", "tools",
]

[[tool.importlinter.contracts]]
name = "Movement policy remains pure and shared"
type = "forbidden"
source_modules = ["harness.movement"]
forbidden_modules = [
    "harness.controller", "harness.gameplay", "harness.server", "harness.__main__",
    "http", "urllib", "socket", "subprocess", "tools", "time", "pathlib", "os",
]
