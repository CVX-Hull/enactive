[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.importlinter]
root_package = "harness"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Controller remains independent of adapters and tooling"
type = "forbidden"
source_modules = ["harness.controller"]
forbidden_modules = [
    "harness.server", "harness.__main__", "http", "urllib", "socket",
    "tools", "subprocess", "argparse",
]

[[tool.importlinter.contracts]]
name = "Server does not depend on CLI or build tooling"
type = "forbidden"
source_modules = ["harness.server"]
forbidden_modules = ["harness.__main__", "tools"]

[[tool.importlinter.contracts]]
name = "Gameplay records and evidence cannot dispatch or launch tools"
type = "forbidden"
source_modules = ["harness.gameplay"]
forbidden_modules = [
    "harness.controller", "harness.server", "harness.__main__",
    "http", "urllib", "socket", "subprocess", "tools",
]

[[tool.importlinter.contracts]]
name = "Player tools use ingress and cannot instantiate an executor"
type = "forbidden"
source_modules = ["harness.mission_client", "harness.player_tools", "harness.player_mcp"]
forbidden_modules = [
    "harness.controller", "harness.server", "harness.mission_runtime",
    "harness.native_process", "harness.__main__",
]

[[tool.importlinter.contracts]]
name = "Movement policy remains pure and shared"
type = "forbidden"
source_modules = ["harness.movement"]
forbidden_modules = [
    "harness.controller", "harness.gameplay", "harness.server", "harness.__main__",
    "http", "urllib", "socket", "subprocess", "tools", "time", "pathlib", "os",
]

[[tool.importlinter.contracts]]
name = "Shared memory and time do not depend on mission or CDDA bindings"
type = "forbidden"
source_modules = [
    "harness.gameplay.campaign_memory", "harness.gameplay.memory_contracts",
    "harness.gameplay.memory_ports", "harness.gameplay.source_contracts", "harness.gameplay.timeline",
]
forbidden_modules = [
    "harness.gameplay.mission_contracts", "harness.gameplay.mission_ledger",
    "harness.gameplay.mission_memory", "harness.gameplay.evidence",
    "harness.gameplay.procedure_library", "harness.gameplay.procedure_archive",
    "harness.gameplay.cdda_identity", "harness.gameplay.cdda_memory", "harness.gameplay.cdda_timeline",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "assurance_context: advisory C-RUNTIME context projection and copy isolation; docs/components/player-interface.md#context-and-failure-boundaries",
    "assurance_memory: advisory C-RUNTIME durable memory provenance and source loss; docs/components/memory-learning.md#failure-bounds-and-ownership",
    "assurance_freshness: advisory C-RUNTIME original capture and current input authority; docs/components/native-control.md#internal-responsibilities",
    "assurance_ingress: advisory C-RUNTIME operation identity and uncertain delivery in HTTP fixtures; docs/components/player-interface.md#assurance-and-evidence",
    "assurance_execution: advisory C-RUNTIME accounting and authority recovery in SQLite fixtures; docs/components/mission-execution.md#assurance-and-evidence",
    "assurance_native: advisory C-RUNTIME compiled receiver fixture for production dispatch boundaries; no actual-game qualification; docs/components/native-control.md#assurance-and-evidence",
    "assurance_program: advisory C-RUNTIME bounded program execution and ordinary fallback in JS/writer fixtures; docs/components/memory-learning.md#assurance-and-evidence",
    "assurance_advice: advisory C-RUNTIME advice and procedure provenance without authority in SQLite/archive fixtures; docs/components/memory-learning.md#assurance-and-evidence",
    "assurance_observer: advisory C-RUNTIME passive status projection in host/HTTP fixtures; no browser-layout or cadence proof; docs/components/observer-operations.md#assurance-and-evidence",
    "assurance_governance: advisory C-GOVERNANCE registry structure in isolated fixtures; no prose-truth or reviewer-performance proof; docs/testing.md#engineering-assurance",
]
