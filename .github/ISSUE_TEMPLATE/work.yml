name: Work proposal
description: Propose a bounded improvement, investigation or documentation change.
title: "Work: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and describe one reviewable outcome. Proposals are not commitments.
        Redact secrets and private data; use the security policy for suspected vulnerabilities.
  - type: textarea
    id: outcome
    attributes:
      label: Problem and intended outcome
      description: Who benefits and why? Name one capability, qualification/repair outcome or discovery/enabler decision. A proposal need not resolve every Ready decision yet.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Separate required core from optional scope. Start at the highest affected architecture boundary, then name components, interfaces/state/callers, code/tests and operating docs. Link parent context and shared acceptance; no duplicate plan is required.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions
      description: State what this proposal will leave out so it stays bounded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and evidence
      description: Give observable success/failure and stop/rescope conditions. Select checks and design/code/outcome reviews by risk. Include needed validation, current documentation and cleanup; do not require every lane or a report per attempt. A negative investigation does not accept a failed capability.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link related issues or decisions; identify prerequisites. Write none known if appropriate.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - S; one bounded slice
        - M; several cohesive steps
        - L; split before Ready
        - Unknown; investigation needed
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence in estimate
      options:
        - High; comparable local evidence
        - Medium; understood with material assumptions
        - Low; major unknowns
    validations:
      required: true
  - type: textarea
    id: effort
    attributes:
      label: Appetite and forecast
      description: Before Ready, state what effort this outcome merits, estimated whole-outcome range/units and assumptions (including review, integration, rework and completion). Link parent values for shared work; unknowns are valid during proposal. Planning does not authorize or renew game/API resources.
    validations:
      required: true
  - type: textarea
    id: uncertainty
    attributes:
      label: Alternatives, risks and unknowns
      description: Note consequential tradeoffs, maintenance cost and assumptions to verify. Write none known if appropriate.
    validations:
      required: true
