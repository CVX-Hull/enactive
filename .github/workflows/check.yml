name: Portable controller checks
# MEASUREMENT ONLY (#557): three lanes as separate jobs. This branch is never merged.
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  structure-and-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --cache-dir .cache/pip --require-hashes -r requirements-dev.lock
      - run: npm --userconfig /dev/null --cache "$PWD/.cache/npm" ci --ignore-scripts --no-audit --no-fund
      - run: npm --userconfig /dev/null --cache "$PWD/.cache/npm" --prefix tools/player_host ci --ignore-scripts --no-audit --no-fund
      - run: npm --userconfig /dev/null --cache "$PWD/.cache/npm" --prefix tools/curator_host ci --ignore-scripts --no-audit --no-fund
      - name: Structural checks
        run: .venv/bin/python tools/check.py --profile main
      - name: Python tests without the adapter suite
        run: >
          .venv/bin/python -m pytest -q -n 4 --dist worksteal --max-worker-restart=0 --durations=10 tests
          --deselect tests/test_player_host_adapter.py::PlayerHostAdapterTests::test_adapter_sdk_and_subprocess_units
          --deselect tests/test_ci.py::WorkflowPolicyTests::test_required_workflow_establishes_the_selector_platform_assumptions
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --cache-dir .cache/pip --require-hashes -r requirements-dev.lock
      - run: npm --userconfig /dev/null --cache "$PWD/.cache/npm" --prefix tools/player_host ci --ignore-scripts --no-audit --no-fund
      - name: Player-host adapter suite
        run: .venv/bin/python -m pytest -q --durations=3 tests/test_player_host_adapter.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm --userconfig /dev/null --cache "$PWD/.cache/npm" ci --ignore-scripts --no-audit --no-fund
      - run: node_modules/.bin/puppeteer browsers install chrome
      - name: Allow the project Chrome sandbox on this disposable runner
        run: |
          chrome_path=$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")
          test -x "$chrome_path"
          case "$chrome_path" in "$GITHUB_WORKSPACE"/.cache/puppeteer/chrome/*/chrome-linux64/chrome) ;; *) exit 1 ;; esac
          sudo tee /etc/apparmor.d/cdda-project-chrome >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile cdda-project-chrome "$chrome_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/cdda-project-chrome
      - run: node tests/test_viewer.cjs
      - run: node tests/test_investigation.cjs
      - run: node tests/test_investigation_session.cjs
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [structure-and-python, adapter, browser]
    if: always()
    steps:
      - name: Every lane succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          for result in $RESULTS; do test "$result" = success; done
          test -n "$RESULTS"
