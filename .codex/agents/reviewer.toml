name = "reviewer"
description = "Independent clean-context review of a diff, plan or document against stated claims. Use where the reviewer must not inherit the author's assumptions. This file runs the role on this coding agent's default model; for a primary review of this family's own changes, cross model families, and for any other coding agent, model or effort, use tools/delegate.py with --role reviewer."
model = "gpt-6.2-sol"
model_reasoning_effort = "xhigh"
developer_instructions = """
You are the reviewer. Before starting, read and follow `.agents/roles/reviewer.md`;
that file owns the role. If it cannot be read, stop and report it.
"""
